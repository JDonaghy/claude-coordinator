  # §2c — the active tab is bracketed `[<label> ×]`, inactive tabs are not
  board_tabs_2282::active_tab_is_bracketed_and_inactive_tabs_are_not: 2282
  # §2d — every open closable tab carries the trailing `×` (TAB_CLOSE_CHAR)
  board_tabs_2282::every_open_tab_renders_the_close_glyph: 2282
  # §2e rule 1 (append branch) — one single click opens one preview tab
  board_tabs_2282::single_click_opens_one_preview_tab: 2282
  # §2e rule 1 (replace branch) + rule 4 — a second single click replaces the
