  board_tabs_2282::second_single_click_replaces_the_preview_tab_in_place: 2282
  # §2e rule 2 — single-clicking an already-open row activates it, adds nothing
  board_tabs_2282::single_click_on_an_already_open_row_activates_it_without_adding_a_tab: 2282
  # §2e rule 3 — a double click pins the tab and drops the `∘ ` marker
  board_tabs_2282::double_click_pins_the_tab_and_drops_the_preview_marker: 2282
  # §2e — the 2-tab intermediate state the contract explicitly warns not to
  # confuse with the 3-double-click sequence (pinned #101 + preview #102)
  board_tabs_2282::a_pinned_tab_plus_a_single_click_yields_two_tabs_one_of_them_preview: 2282
  # §2e — the headline end state of mocks/board-pinned-3-tabs.screen
  board_tabs_2282::three_double_clicks_yield_three_pinned_tabs_with_the_last_active: 2282
  # §2f (half one) — activating a tab selects the matching sidebar row (`▸`)
  board_tabs_2282::activating_a_tab_selects_its_sidebar_row: 2282
  # §2f (half two) — …and SCROLLS it into view. See the quadraui#595 note below.
  board_tabs_2282::activating_a_tab_scrolls_its_sidebar_row_into_view: 2282

  # ── #2283 (W-2) — close / navigate / overflow / empty state (contract §4) ─
  # Slice: board_tabs_close_2283.rs · mock: board-tabs-overflow.screen
  # (plus board-baseline-no-tabs.screen as §4's empty-state target)
  #
  # §4 — clicking a tab's `×` closes exactly that tab and no other
  board_tabs_close_2283::clicking_a_tabs_close_glyph_closes_exactly_that_tab: 2283
  # #2283 AC — …while clicking its BODY activates it and closes nothing.
  # THIS IS A GREEN RATCHET — see the `expected_red` block below.
  board_tabs_close_2283::clicking_a_tab_body_activates_it_without_closing_it: 2283
  # §4 — middle-click anywhere on a tab (not just its `×`) closes it
  board_tabs_close_2283::middle_clicking_a_tab_body_closes_it: 2283
  # §4 — `Ctrl-W` closes the active tab, left neighbour becomes active
  board_tabs_close_2283::ctrl_w_closes_the_active_tab_and_activates_its_left_neighbour: 2283
  # §4 — …and the rule's other branch: leftmost closed → new leftmost active
  board_tabs_close_2283::ctrl_w_on_the_leftmost_tab_activates_the_new_leftmost: 2283
  # §4 — `Ctrl-Tab` next, wrapping last → first
  board_tabs_close_2283::ctrl_tab_moves_to_the_next_tab_and_wraps_at_the_end: 2283
  # §4 — `Ctrl-Shift-Tab` previous, wrapping first → last
  board_tabs_close_2283::ctrl_shift_tab_moves_to_the_previous_tab_and_wraps_at_the_start: 2283
  # §4 — overflow: `‹` renders, `›` does not, active tab stays visible
  board_tabs_close_2283::overflowing_tabs_render_the_left_scroll_affordance_and_keep_the_active_tab_visible: 2283
  # §4 — the mirror case §4 tells a test-author to drive for `›`
  board_tabs_close_2283::activating_a_scrolled_out_tab_scrolls_it_back_into_view_and_renders_the_right_affordance: 2283
  # §4 — closing the LAST tab restores the zero-tab baseline
  board_tabs_close_2283::closing_the_last_tab_restores_the_zero_tab_baseline: 2283
  # §4 + §2a — CONTROL: strip chrome (`×`, `‹`, `›`) must not leak into the
  # zero-tab state. THIS IS THE GREEN CONTROL — see `expected_red` below.
  board_tabs_close_2283::zero_tabs_render_no_close_or_overflow_glyphs: 2283

