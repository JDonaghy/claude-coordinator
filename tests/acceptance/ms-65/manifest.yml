# Acceptance manifest for milestone ms-65 ("coord-tui: per-panel document tabs
# (preview/pin)", tracking issue #2289). Maps each acceptance test-id -> the
# work-order issue it covers.
#
# Driver: tui-tuidriver (coordinator.yml `acceptance.drivers`, route `tui/**`)
#   cd tui && cargo test --test acceptance -- --format json
#
# Test-ids are the libtest `name` emitted by `cargo test --test acceptance`
# (module-qualified fn path). The slice files live in this directory and are
# `include!`d at crate root by `tui/tests/acceptance.rs`.
#
# Merged (never clobbered) across issues by coord.acceptance.load_manifest —
# #2283 / #2284 / #2285 / #2286 / #2287 / #2288 append their own entries here
# when their slices are authored just-in-time. #2281 has no UI surface of its
# own (contract §7) and therefore no slice; it is exercised by every test below
# running at all, since `make_app_with_board_json` is what seeds their fixture.

tests:
