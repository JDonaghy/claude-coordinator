  # #2533 — OBSERVED, not intended. Taken from a real run of the sealed suite
  # at authoring time (the driver command quoted at the top of this file, run
  # from this repo at `test-author-ms-67-slice-2533`): 6 of this slice's 7 ids
  # FAILED. Every one of them needs the row context menu, which does not exist
  # yet — the four §4a ids fail on the missing "Pull into decomposition
