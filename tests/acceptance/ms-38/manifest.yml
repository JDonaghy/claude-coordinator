# Acceptance manifest for milestone ms-38 (Plans panel -> rich client,
# tracking #1120).  Maps each acceptance test-id -> the work-order issue it
# covers.
#
# Test-ids are the libtest `name` emitted by `cargo test --test acceptance`
# (module-qualified fn path). The slice files live in this directory and are
# `include!`d at crate root by `tui/tests/acceptance.rs`.
#
# WIRING: `tui/tests/acceptance.rs` is OUTSIDE `sealed_paths`, so the
# `include!("../../tests/acceptance/ms-38/plans_help_1124.rs");` line these
# ids depend on is deliberately NOT part of this test-author diff (#1175
# makes any out-of-seal touch a mandatory request-changes). It must be added
# by a separate non-test-author step before these ids can run at all — see
# the ⚠ WIRING REQUIRED block at the top of plans_help_1124.rs. Until then
# `cargo test --test acceptance` silently reports zero ms-38 tests.
#
# Merged (never clobbered) across issues by coord.acceptance.load_manifest —
# the sibling children's slices (#1122 CC-2 detail pane, #1123 CC-3
# right-click menus) append their own entries here against the same contract.
tests:
  # ── #1124 CC-4: `?` help overlay + command palette (contract §5) ──
  # §5a/§5b — help overlay trigger + "Plans — Help" title
  plans_help_1124::help_overlay_opens_on_question_mark: 1124
  plans_help_1124::help_overlay_closes_on_esc: 1124
  # §5c — cheatsheet key entries (phrases unique to the overlay)
  plans_help_1124::help_overlay_navigation_entries: 1124
  plans_help_1124::help_overlay_action_entries: 1124
  # §5d — health-chip legend
  plans_help_1124::help_overlay_health_chip_legend: 1124
  # §5e/§5f — palette trigger (`/`) + "command palette" / "Plans actions"
  plans_help_1124::palette_opens_on_slash: 1124
  plans_help_1124::palette_closes_on_esc: 1124
  # §5g — registered Plans action entries
  plans_help_1124::palette_lists_plans_actions: 1124
  # §5h — search filtering
  plans_help_1124::palette_search_filters_entries: 1124
  # §5i — status bar shows "Esc=close" for both overlays
  plans_help_1124::help_overlay_status_bar_shows_esc_close: 1124
  plans_help_1124::palette_status_bar_shows_esc_close: 1124
