name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      # #2180: `--ignore=tests/acceptance` — the sealed oracle-loop suite
      # (tests/acceptance/ms-NN/) is split out of the ordinary suite and
      # gated separately, through `coord acceptance run --all --ci` (see the
      # `acceptance-cli` step below and the `acceptance` job further down),
      # which honours each ms-NN/manifest.yml's `expected_red:` registry
      # (#2164). Left in here, a red-by-design slice would fail this job
      # outright — every ordinary PR in the repo, not just the one the slice
      # belongs to — exactly the quadraui#554/#490 failure mode #2180 exists
      # to close. ms-33/ms-38 (Rust, feature-gated behind test-support) and
      # ms-51 (Playwright, not .py) were never swept in here; ms-37 (plain
      # .py files under testpaths=["tests"]) was the one accidental gap.
      - run: pytest --ignore=tests/acceptance
      # #2180: the cli-pytest sealed route (acceptance.drivers routes
      # "coord/**" -> cli-pytest -> tests/acceptance/ms-37) run through the
      # #2164 CI wrapper instead of a raw `pytest tests/acceptance` call, so
      # expected_red is honoured. One matrix leg only — the suite result
      # doesn't depend on the Python version any differently than the
      # ordinary suite above does, so running it twice would just double the
      # cost for no new signal. See .github/coord-ci-acceptance.yml's header
      # for why this points at a CI-local config rather than
      # ~/.coord/coordinator.yml (unreachable from a runner).
      - name: coord acceptance run --all --ci (cli-pytest route, ms-37)
        if: matrix.python-version == '3.12'
        run: >-
          coord acceptance run --repo claude-coordinator --all --ci
          --for-path coord/cli.py
          --config .github/coord-ci-acceptance.yml --path .

  # #1895 (CP-4 slice of #1159): real Windows verification — the repo is
  # public, so `windows-latest` runners cost nothing.
  #
  # PUSH-TO-MAIN ONLY, not per-PR (#2039). This job takes ~21-28 min while
  # every other job finishes in ~6, and `coord merge`'s gate blocks on
  # `checks_pending` — so per-PR it was ~20 min of pure MERGE LATENCY, not
  # just CI wall-clock. It is also the string in every park event from the
  # 2026-08-08 stall (`parked — CI running: windows`): each drive parked on it
  # and handed off, which is how five PRs piled up unmerged.
  #
  # What that latency bought per-PR was ~nothing. The job is deliberately red
  # and non-blocking (see below), so nothing gates on its result; its output
  # is one number (`368 failed, ...`) that only moves when someone works on
  # #1156. Running it per-merge keeps that baseline just as current.
  #
  # REVISIT WHEN #1156 LANDS. Once the suite is genuinely green and blocking,
  # per-PR coverage is worth its duration again — and at that point the right
  # move is probably to keep it per-PR but shrink it to the import smoke
  # #1895's own title describes, rather than the full suite.
  #
  # This job is EXPECTED TO BE RED when it lands: `coord.cli` cannot import
  # on Windows today (`cli.py` -> `coord/interactive.py`'s unconditional
  # `import fcntl`, a POSIX-only stdlib module). #1156 (CP-1, the import
  # guards) is what makes this suite green — and #1156 is the one that
  # removes the `continue-on-error` below. Until then this is a
  # visible-but-non-blocking signal, not a real gate.
  #
  # `continue-on-error` MUST stay on the *step*, not the job (#2026).
  # At job level it only softens the *workflow run* conclusion; the `windows`
  # **check** still reports `failure` to the Checks API. GitHub's own branch
  # protection tolerates that, but `coord merge`'s CI gate does not —
  # `coord.ci_store._PASSING_CONCLUSIONS` is {success, skipped, neutral} with
  # no notion of a non-blocking check, so a job-level flag left every
  # claude-coordinator PR unmergeable and stalled the drive queue overnight
  # on 2026-08-08 (four finished PRs, everything else green). At step level
  # the step's failure is recorded but the job exits 0, so the check is
  # `success` and #1895's actual acceptance criterion — "it does not block
  # merges while red" — finally holds. The failures stay fully visible in the
  # job log; that log IS the #1156 specification and the pass/fail baseline.
  #
  # Python 3.12 only, deliberately not the 3.12/3.13 matrix `test` runs above
  # — the matrix axis there is Python versions on Linux; this job's axis is
  # the platform. See docs/CROSS_PLATFORM.md §9.
  windows:
    # #2039: on `push` (i.e. merges to main) only. On a `pull_request` event
    # this evaluates false and the job is SKIPPED — conclusion `skipped`,
    # which is already in `ci_store._PASSING_CONCLUSIONS`, so the merge gate
    # is satisfied rather than merely tolerant. `windows` is not a required
    # status check either, so branch protection is unaffected.
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Both steps carry the flag, not just pytest: a Windows-only *install*
      # failure would otherwise redden the job and re-block the whole repo
      # exactly as a test failure did. Until #1156, this job's contract is
      # "always report, never block" — and a failed install is every bit as
      # visible in the log as a failed test.
      - run: pip install -e ".[dev]"
        continue-on-error: true
      # #2180: same split as the `test` job above — the sealed acceptance
      # suite is gated separately through the #2164 CI wrapper, not swept
      # into this job's ordinary pytest run.
      - run: pytest --ignore=tests/acceptance
        continue-on-error: true

  # #1484: run the full suite with `gh` made unresolvable on PATH.
  #
  # Filed after the #1472 elitebook incident: a worker's systemd PATH excluded
  # its linuxbrew-installed `gh`, and ~98 tests that inject every other
  # dependency (pr_lookup, branch_sha_fetcher, ...) still reached one live
  # `gh` subprocess call through an unmocked seam — so the suite's result
  # depended on the host, not the code. #1483 closed the production-code half
  # (every `gh` invocation now funnels through coord/github_ops.py, whose
  # `_gh()` turns a missing/hung `gh` into a typed, caught error instead of a
  # raw FileNotFoundError escaping past `except RuntimeError` guards). This
  # job is the regression guard for that fix: without it, the next unmocked
  # seam is invisible again until someone's agent happens to lack the binary.
  #
  # `ubuntu-latest` ships `gh` preinstalled, so this can't be a no-op PATH
  # trick like `PATH=/usr/bin:/bin` (which would miss it entirely on hosts —
  # dellserver, precision — where `gh` itself lives at /usr/bin/gh).
  # scripts/run_tests_without_gh.sh instead shadows only the PATH directories
  # that actually contain a `gh` binary, wherever that is, leaving every other
  # directory (notably the venv's own bin/) untouched.
  no-gh-on-path:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      # #2180: same split as the `test` job — the sealed acceptance suite is
      # gated separately through the #2164 CI wrapper.
      - run: scripts/run_tests_without_gh.sh python -m pytest tests/ -q --ignore=tests/acceptance

  # #2170: run the full suite in the environment of a REAL FLEET MACHINE — a
  # populated `~/.coord/` (thin-client shaped), no `sqlite3` on PATH, and a
  # `$TMPDIR` under an ancestor pytest config.
  #
  # This job exists because the `test` matrix above is structurally incapable
  # of catching the class it covers. Six tests failed on `origin/main` on every
  # fleet machine while `ubuntu-latest` stayed green on 3.12 AND 3.13 — the
  # INVERSE of the familiar "passes locally, fails only in CI ⇒ ambient $HOME"
  # pattern. They passed in CI *precisely because* CI's `$HOME` is empty, and a
  # matrix whose only environment is the empty one can never see that.
  #
  # What it cost while invisible: the Test stage on `precision` could not
  # produce a green verdict for this repo on ANY branch. Every dispatch there
  # returned `SMOKE: fail`, the branch was blamed for breakage it did not
  # cause, and a human read the log and adjudicated — 11m36s and $0.61 for zero
  # signal about the branch, repeatedly, for months (claude-coordinator#2158).
  #
  # SAME SHAPE AS `no-gh-on-path` ABOVE, AND FOR THE SAME REASON. That job
  # (#1484) exists because a host-dependent `gh` made the suite's result depend
  # on the machine rather than the code; this one exists because a
  # host-dependent `$HOME`/`$PATH`/`$TMPDIR` did the same thing in the opposite
  # direction. Both mask by NAME rather than by dropping PATH directories — see
  # `scripts/run_tests_in_populated_home.sh`'s header for why
  # `PATH=/usr/bin:/bin` is the wrong recipe here.
  #
  # `tests/test_ambient_home_isolation.py` pins the specific affected targets
  # on every run everywhere (including this job, and including a fleet
  # machine's own Test leg) — that is the always-on gate, and it is what fails
  # first if one of the three regresses. THIS job is the whole-suite sweep: it
  # is what finds the NEXT test of this class before a fleet machine does.
  # Verified at authoring time: 9590 passed, 13 skipped under these three knobs.
  populated-home:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      # #2180: same split as the `test` job — the sealed acceptance suite is
      # gated separately through the #2164 CI wrapper.
      - run: scripts/run_tests_in_populated_home.sh python -m pytest tests/ -q --ignore=tests/acceptance
      - name: What a red result here means
        if: failure()
        run: |
          echo "::error::The suite is red under a POPULATED \$HOME (thin-client ~/.coord/, no sqlite3 on PATH, \$TMPDIR under an ancestor pytest config) while the plain 'test' job may well be green."
          echo "That difference IS the finding, not noise: a test that needs an empty \$HOME cannot pass on any fleet machine, so the Test stage there can never go green and every dispatch costs a human adjudication (#2170)."
          echo "Fix the TEST's isolation -- redirect \$HOME/XDG at tmp_path, drop COORD_SERVICE_URL/COORD_TOKEN/COORD_CONFIG, skip-guard an unprovisioned system binary, pin a nested pytest's --rootdir."
          echo "Do NOT fix it by making the product trust an ambient path: 'coord config --config' is deliberately NOT authoritative on a thin client (CLAUDE.md, docs/EPHEMERAL_WORKERS.md)."
          echo "Reproduce locally: scripts/run_tests_in_populated_home.sh python -m pytest tests/ -q"

  # #906: run the test suite in thin-client mode with COORD_STRICT_LOCAL_BOARD=1
  # so any board touch reachable from a thin-client path raises RuntimeError
  # instead of silently no-oping against an empty local DB.  This job catches
  # regressions that only manifest on a thin client (where the daemon holds the
  # canonical DB but the CLI/notify runs on a laptop without a local copy).
  thin-client-strict:
    runs-on: ubuntu-latest
    env:
      COORD_STRICT_LOCAL_BOARD: "1"
      # Simulate a thin-client: point board-service at a non-existent URL so
      # resolve_board_service() returns a non-None svc and the guard fires.
      # Tests that monkeypatch board-service themselves will override this.
      COORD_SERVICE_URL: "http://localhost:19999"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      # Run only the audit + thin-client-specific tests to avoid hammering
      # the daemon-guarded paths in the full suite (which legitimately hit
      # local board state on the daemon host).
      #
      # #906: added test_thin_client_daemon_routing_906.py (daemon-routing +
      # fail-open coverage for the new endpoints/functions) and test_smoke.py
      # (reconcile()'s thin-client get_issue_test_mode regression) so this job
      # actually exercises COORD_STRICT_LOCAL_BOARD against the new #906
      # functions, not just the original build_board/save_board/load_board
      # triad.
      #
      # NOT added: test_state.py / test_review_verdict_relay.py. Both contain
      # tests that assert the *warn* (non-strict) behavior of the local-board
      # guard while simulating a thin client — under this job's ambient
      # COORD_STRICT_LOCAL_BOARD=1 those calls raise instead of warn and the
      # assertions fail, because the guard reads the env var directly rather
      # than a value those tests control. That's a pre-existing test-isolation
      # gap (COORD_STRICT_LOCAL_BOARD leaks in as ambient env instead of each
      # "warns" test forcing it unset), not something introduced by #906 —
      # tracked as a follow-up rather than fixed here to keep this PR's scope
      # to the review findings.
      - run: |
          pytest tests/test_thin_client_board_audit.py \
                 tests/test_state_review_findings_daemon.py \
                 tests/test_thin_client_daemon_routing_906.py \
                 tests/test_smoke.py \
                 -v

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: coord/dashboard/webapp
    steps:
      - uses: actions/checkout@v4
      # #1551: `live-update-fixture.spec.ts` spawns a real
      # `coord web --fixture` process, so the CLI has to be installed and on
      # PATH — without it Playwright fails with `spawn coord ENOENT`. Every
      # earlier spec drove a browser only, which is why this job never needed
      # Python before. The job defaults `run:` steps into the webapp
      # directory, so the install step overrides it back to the repo root.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - working-directory: .
        run: pip install -e ".[dev]"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npm run test:e2e

  # #1950: the SEALED oracle-loop acceptance suite (tests/acceptance/ms-NN/,
  # playwright.acceptance.config.ts) was run by no automatic gate anywhere —
  # only `coord acceptance run/record`, invoked once while a milestone was
  # being driven and never again. ms-51 went red at #1547 (the responsive
  # shell removed the `<h1>coord</h1>` §1a pins) and stayed red through
  # #1548/#1550/#1551/#1818 with nothing noticing. This job is the cheapest
  # fix named in #1950: run the accumulated sealed suite on every push/PR,
  # same shape as `e2e` above (Python for the `coord` CLI on PATH — the
  # acceptance config's `webServer` shells out to `coord web --fixture
  # ... --dist dist`, see playwright.acceptance.config.ts's module
  # docstring — plus Node + a real chromium).
  #
  # `npm run test:acceptance` with NO `{ms}` filter (unlike a single
  # milestone's `-- ms-NN`) walks the whole `tests/acceptance/` tree — the
  # accumulated suite across every closed milestone, i.e. exactly `coord
  # acceptance run --all` (Gate C) would assemble, just invoked by CI's
  # cadence instead of a milestone-close event.
  #
  # Deliberately NOT added to scripts/coord-test-runner.sh (the Test gate's
  # engine, coordinator.yml's `test_command`): that script also runs as a
  # systemd *user* unit on the daemon host (#1814's PATH problem) and would
  # need node/npm/chromium provisioned there for every future
  # coord/dashboard/webapp/** branch's Test stage, not just this
  # already-`browser`-capability-gated CI runner. CI is the tighter, cheaper
  # loop for this suite; revisit the Test-gate route if CI's cadence turns
  # out not to be enough (#1950's own "decide deliberately").
  #
  # ATTRIBUTABILITY (#1950 item 2): a red result here names a spec file
  # under `tests/acceptance/ms-NN/` and, by that suite's own convention
  # (tests/acceptance/ms-51/manifest.yml), a `describe` block carrying the
  # milestone's tracking issue — e.g. `ms-51/home-active.spec.ts › ms-51
  # Home Active tab (#1544) › ...`. Playwright's `list` reporter prints that
  # full path/title on failure, so the ms-NN + issue are already in the
  # job's own output; the failure-hint step below just spells out the two
  # possible causes so whoever triages it doesn't have to rediscover them.
  #
  # #2180: the `npm run test:acceptance` step now runs THROUGH `coord
  # acceptance run --all --ci` (#2164) instead of calling Playwright
  # directly. Same suite, same reporter under the hood — the wrapper's
  # web-playwright driver shape appends `--reporter=json` and reads
  # PLAYWRIGHT_JSON_OUTPUT_FILE itself (coord/acceptance_drivers.py) — but
  # now a test-id listed in a manifest's `expected_red:` that fails does not
  # redden this job (a sealed slice authored red before its fix exists,
  # #2164's whole point), while one that unexpectedly PASSES does, loudly
  # (#1965's vacuous-assertion case). Before this, ms-51 going red for any
  # reason failed this job exactly the same as every other kind of red —
  # there was no way to merge a red-by-design slice without `--force-merge`.
  # .github/coord-ci-acceptance.yml's header explains why this points at a
  # CI-local config instead of the fleet's real ~/.coord/coordinator.yml.
  acceptance:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: coord/dashboard/webapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - working-directory: .
        run: pip install -e ".[dev]"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - name: coord acceptance run --all --ci (web-playwright route, ms-51)
        working-directory: .
        run: >-
          coord acceptance run --repo claude-coordinator --all --ci
          --for-path coord/dashboard/webapp/src/App.tsx
          --config .github/coord-ci-acceptance.yml --path .
      - name: A red result here is attributable, not a mystery
        if: failure()
        run: |
          echo "::error::The sealed acceptance suite (tests/acceptance/ms-NN/) failed."
          echo "The failing spec's path and 'describe' title name the milestone (ms-NN) and the issue that slice was authored for (see tests/acceptance/ms-NN/manifest.yml)."
          echo "Two causes, and only one fix is right:"
          echo "  1. The app regressed against an still-accurate contract -> fix the app."
          echo "  2. Legitimate app evolution made the contract stale (e.g. #1547 vs ms-51) -> amend the contract: coord acceptance mock <repo> <tracking_issue> --amend '<what changed and why>'"
          echo "Do not silence this job (continue-on-error, skip, etc.) instead of doing one of the above -- that is exactly how ms-51 rotted unnoticed through #1547-#1818 (#1950)."

  # #1550: `coord/dashboard/webapp/src/api/generated.ts` is produced by
  # `scripts/codegen.py` from the dashboard's OpenAPI spec
  # (`coord.dashboard.server.openapi_spec()`) — this job is the drift gate.
  # `--check` regenerates in memory and fails without writing if the
  # committed file differs, so a Python dataclass field change that forgot
  # to `python scripts/codegen.py` fails CI here instead of shipping a
  # webapp that silently drops/misreads a field (the #632 failure class).
  # `npm run typecheck` + the Vitest suite then confirm every consumer of
  # the generated types (client.ts, the components) still compiles and
  # passes against whatever the regenerated shape is.
  webapp-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python scripts/codegen.py --check
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - working-directory: coord/dashboard/webapp
        run: npm ci
      - working-directory: coord/dashboard/webapp
        run: npm run typecheck
      - working-directory: coord/dashboard/webapp
        run: npm run test
