name: Rust tests

# Closes the gap documented in GOAL.md (2026-06-11):
#   "CI is pytest-only, so Rust repos (tui/quadraui/vimcode) still have no
#    automated gate; they need an explicit cargo build && cargo test gate."
# Issue #741 called for either resolving or tracking the gap — this resolves it
# for the coord-tui crate (the tui/ subdirectory of this repo).
#
# #1973: tui/Cargo.toml pins quadraui by `git`/`rev` rather than a sibling
# path dependency, so `cargo test` here fetches quadraui straight from
# GitHub at the pinned rev — there is nothing left to check out or reproduce
# a sibling-directory layout for. That also retired this workflow's original
# #1865 role: the schedule/workflow_dispatch "canary" triggers below used to
# build tui/ against quadraui's *moving* `develop` branch specifically to
# catch a quadraui-side break before it reached coord-tui. Since the pin, a
# scheduled run here would just rebuild the same pinned rev every time and
# report green regardless of what quadraui's develop is doing — a canary
# that can't smell smoke. Per #1973's decision, vimcode (which keeps the
# floating path dep on purpose) is the sole canary for quadraui breaks going
# forward; this workflow is back to being a plain gate on tui/** changes.
on:
  push:
    branches: [main]
    paths:
      - 'tui/**'
      # Self-trigger so edits to this workflow are exercised by their own PR.
      - '.github/workflows/cargo-test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tui/**'
      # Self-trigger so edits to this workflow are exercised by their own PR.
      - '.github/workflows/cargo-test.yml'
  # Manual re-run convenience — no longer a "check tui/ against quadraui
  # develop" canary (see #1973 note above); it now just builds tui/ at
  # whatever ref is checked out, same as push/pull_request.
  workflow_dispatch:

jobs:
  cargo-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tui

      # A few tui integration tests (commands::tests) spawn the real `coord`
      # CLI (e.g. `coord --version`) via Command::new("coord") and assert it
      # succeeds, so the Python package must be installed and on PATH inside
      # this otherwise Rust-only job.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install coord CLI (tui integration tests spawn it)
        run: pip install -e .

      - name: cargo test (tui)
        working-directory: tui
        run: cargo test
